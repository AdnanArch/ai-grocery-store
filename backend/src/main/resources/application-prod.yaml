# Production Configuration for AI Grocery Store
# Gmail SMTP Configuration

spring:
  # Gmail SMTP Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          quitwait: false

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:grocerystore}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        connection:
          characterEncoding: utf8
          useUnicode: true

  # Multipart file upload configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

# Production-specific settings
server:
  port: 8080

# Enhanced logging for production
logging:
  level:
    root: WARN
    com.groceryapp.backend: INFO
    org.springframework.mail: INFO
    com.groceryapp.backend.service.EmailService: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Security settings
jwt:
  key: ${JWT_KEY:ZmQ0ZGI5NjQ0MDQwNDIxNDJiZDY4MzJkNGZhNGM2ZmMyM2Y1YTg5ZGE0ODBjM2I4NzE5NzYxZjdjOWIyYzNhNDY=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  header: Authorization
  prefix: Bearer

# Application settings
app:
  frontend-url: ${FRONTEND_URL:https://your-production-domain.com}
  environment: production
