spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  # Disable email service for testing
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 0

jwt:
  key: test-jwt-key-for-testing-purposes-only
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000
  header: Authorization
  prefix: Bearer

logging:
  level:
    root: WARN
    org.springframework.security: WARN

# Test Stripe Configuration
stripe:
  secret:
    key: sk_test_test_key_for_testing
  publishable:
    key: pk_test_test_key_for_testing

# Test Application Configuration
app:
  frontend-url: http://localhost:3000
  ai-service-url: http://localhost:5000
